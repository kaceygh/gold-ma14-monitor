name: Gold MA14 Cross Monitor (30min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Gold MA14 Monitor
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python3 gold_ma14_twelve.py

      - name: Commit updated files
        run: |
          git config user.name "Gold Monitor Bot"
          git config user.email "bot@goldmonitor.local"
          git add gold_ma14_status.json gold_ma14_signal_memory.json gold_ma14_history.csv gold_ma14_twelve_report.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: gold-report
          path: gold_ma14_twelve_report.html
